services:
  mysql:
    image: mysql:8
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "3306:3306"
    volumes:
      - ./Database/mysql_data:/var/lib/mysql
      - ./Database/init:/docker-entrypoint-initdb.d

  backend:
    restart: always
    build: ./api/Api
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      Jwt__SecretKey: ${JWT_SECRET_KEY:?Configure JWT_SECRET_KEY no arquivo .env}
      ConnectionStrings__DefaultConnection: Server=mysql;Port=3306;Database=${MYSQL_DATABASE};User=root;Password=${MYSQL_ROOT_PASSWORD};
      LoginProxy__KnownProxies__0: &frontend_ip 172.29.240.10
    # Port will be removed in production.
    ports:
      - "5000:8080"
    depends_on:
      - mysql
    networks:
      - default
      - auth_proxy

  frontend:
    restart: always
    build: ./system
    environment:
      API_BASE_URL: http://backend:8080
      TRUSTED_CLIENT_IP_HEADER: x-real-ip
      HOSTNAME: 0.0.0.0
    depends_on:
      - backend
    networks:
      auth_proxy:
        ipv4_address: *frontend_ip

  ingress:
    restart: always
    image: nginx:stable-alpine
    ports:
      - "3000:80"
    volumes:
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
    networks:
      - auth_proxy

networks:
  auth_proxy:
    ipam:
      config:
        - subnet: 172.29.240.0/24




